name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      MONGO_DB: secondChance_test
      JWT_SECRET: test-only-not-a-production-secret
      NODE_ENV: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint JavaScript Files
        run: npm run lint
      - name: Test API and authentication against MongoDB
        run: npm test
      - name: Build application container
        run: docker build -t secondchance:ci .
